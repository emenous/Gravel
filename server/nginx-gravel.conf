# Add inside the existing prntscrn.dev server {} block.
# Static files should live in the site's normal document root under /Gravel/.

location = /Gravel/ws {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 70s;
    proxy_send_timeout 70s;
}

# The message used both Gravel and Grave. Keep the typo URL working too.
location = /Grave { return 301 /Gravel/; }
location ^~ /Grave/ { return 301 /Gravel/; }
